---
- name: Build Image
  hosts: all
  gather_facts: no
  become: no
  vars:
    hostname: "JMP01"
    jump_user: "jump_operator"
    jump_password: "oIDlQW2yVwocnyj2!"
    subnet3_cidr: "10.1.3.0/24"
  tasks:

    # Do NOT guard later tasks with until/retries instead of this - it doesn't
    # retry connection-level exceptions ([Errno 111] would kill the run outright).
    - name: Wait for first boot and let cloudbase-init settle, then disable it
      ansible.builtin.include_tasks: ../win-common/wait-for-first-boot.yml

    - name: Remote access, Defender-off, hostname, mid-build reboot (shared baseline)
      ansible.builtin.include_tasks: ../win-common/base-access.yml

    - name: Dedicated jump-host account
      block:
      - name: Create {{ jump_user }} (local Administrator — zero-extra-config WinRM+RDP)
        ansible.windows.win_user:
          name: "{{ jump_user }}"
          password: "{{ jump_password }}"
          state: present
          groups:
            - "Users"
            - "Administrators"
          password_never_expires: yes

      - name: Create a profile for the jump-host account
        ansible.windows.win_user_profile:
          username: "{{ jump_user }}"
          name: "{{ jump_user }}"
          state: present

    - name: Outbound network isolation — no route from this VM into Subnet 3
      block:
      - name: Block all outbound traffic to the OT field network ({{ subnet3_cidr }})
        community.windows.win_firewall_rule:
          name: "Block-Outbound-Subnet3"
          direction: out
          action: block
          remoteip: "{{ subnet3_cidr }}"
          enabled: yes
          profiles:
            - domain
            - private
            - public

    - name: NTLM, execution policy, UAC-off, Private profile (shared baseline)
      ansible.builtin.include_tasks: ../win-common/base-finalize.yml

    - name: Generalize this image with Sysprep
      ansible.builtin.include_tasks: ../win-common/sysprep.yml
