---
# Included at the end of each image's own play (guarded by
# run_sysprep_in_base for images that get configured further after
# import_playbook - see win11-patient-zero/win11-engineering-workstation).
# {{ playbook_dir }} resolves to the directory of whichever image's play is
# currently running - each image ships its own unattend.xml with its own
# admin password, verified via ansible-core's per-play basedir handling
# (executor/playbook_executor.py sets loader basedir from the play's own
# source file before running it, and playbook_dir is read from that same
# basedir), not the shared win-common/ directory this file lives in.

# Sysprep validates that no update/servicing operation is pending ("reserved
# storage in use") and, just like the BitLocker case below, doesn't exit
# cleanly on that failure - it just hangs forever instead. Installing
# Windows Capabilities (OpenSSH, RSAT) earlier in the play leaves a pending
# reboot/CBS state that trips this validation. Confirmed live: RebootPending
# and RebootRequired were both true, and Sysprep's own log showed exactly
# this failure (hr = 0x800F0975) the moment it started, with the process
# then sitting idle for hours instead of returning an error. One more
# reboot right before Sysprep clears that state. No cloudbase-init settle
# needed here - it is disabled (see win-common/wait-for-first-boot.yml), and
# win_reboot already polls for reconnection itself before returning.
- name: Reboot to clear any pending servicing operations before Sysprep
  ansible.windows.win_reboot:
    msg: "Rebooting to clear pending updates before Sysprep"
    reboot_timeout: 900
    post_reboot_delay: 60

- name: Ensure the Panther\Unattend directory exists
  ansible.windows.win_file:
    path: "C:\\Windows\\Panther\\Unattend"
    state: directory

- name: Upload unattend.xml for Sysprep
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/unattend.xml"
    dest: "C:\\Windows\\Panther\\Unattend\\unattend.xml"

# Sysprep hard-fails generalize if the OS volume is encrypted (base image
# picks up an orphaned BitLocker/Device Encryption state - no key
# protector, protection off, but VolumeStatus stays FullyEncrypted until
# explicitly decrypted). Bounded wait so a real problem fails loud. No
# unreachable-retry wrapper needed - cloudbase-init is disabled and this is
# the only thing that was ever cutting this connection.
- name: Decrypt the OS volume if BitLocker/Device Encryption is on
  ansible.windows.win_powershell:
    script: |
      $vol = Get-BitLockerVolume -MountPoint C:
      if ($vol.VolumeStatus -ne 'FullyDecrypted') {
        Disable-BitLocker -MountPoint C: | Out-Null
        $t = 3600
        while ($t -gt 0 -and $vol.VolumeStatus -ne 'FullyDecrypted') {
          Start-Sleep -Seconds 10
          $t -= 10
          $vol = Get-BitLockerVolume -MountPoint C:
          Write-Output ('BitLocker ' + $vol.VolumeStatus + ' ' + $vol.EncryptionPercentage + '%')
        }
        if ($vol.VolumeStatus -ne 'FullyDecrypted') {
          Write-Error 'BitLocker did not finish decrypting before timeout'
          exit 1
        }
      }

# Re-arm cloudbase-init's startup type (not started here) so it runs
# normally the next time this box boots - the real, customer-facing boot
# after generalize. Verified live: with this set to Automatic beforehand, a
# freshly-generalized image boots straight into a working OOBE/specialize
# pass, applies MTU 1442 itself, and comes up clean.
- name: Re-enable cloudbase-init for the post-generalize boot
  ansible.windows.win_service:
    name: cloudbase-init
    start_mode: auto

# Sysprep is the one step that cannot be run inside a single held-open
# WinRM call: /generalize tears the WinRM listener down as part of the
# generalize pass, and the run takes minutes. A previous build died on a
# plain TCP connect timeout before Sysprep had even been launched, and the
# box then stayed unreachable for 640s - longer than the reconnect window
# at the time.
#
# So launch it detached as a SYSTEM scheduled task. Unlike Ansible's async
# watchdog (proven not to survive on these VMs), the Task Scheduler owns the
# process, so it does not care what happens to WinRM. The runner writes its
# verdict to a marker file and powers the box off ONLY on success, which
# makes the outcome decidable without WinRM having to survive generalize:
#   marker says OK / ImageState generalized  -> success
#   marker says FAILED / TIMEOUT / ERROR     -> fail loud, with the reason
#   box gone and never comes back            -> the runner reached its
#                                               shutdown line, so success
#   box back up but not generalized          -> fail loud
# Packer's openstack builder stops the instance via the API afterwards and
# tolerates it already being off, so powering down here is safe. Sysprep is
# never re-run on a connection drop: /generalize is not safely repeatable.
- name: Make sure the box is reachable before starting Sysprep
  ansible.builtin.wait_for_connection:
    timeout: 1800
    sleep: 15

- name: Drop any stale Sysprep result marker
  ansible.windows.win_file:
    path: C:\Windows\Temp\sysprep-result.txt
    state: absent

- name: Stage the detached Sysprep runner
  ansible.windows.win_copy:
    dest: C:\Windows\Temp\run-sysprep.ps1
    content: |
      $ErrorActionPreference = 'Stop'
      $marker = 'C:\Windows\Temp\sysprep-result.txt'
      try {
          Set-Content -Path $marker -Value 'RUNNING' -Encoding ASCII
          $p = Start-Process -FilePath 'C:\Windows\System32\Sysprep\Sysprep.exe' -PassThru -ArgumentList '/oobe', '/generalize', '/quiet', '/quit', '/unattend:C:\Windows\Panther\Unattend\unattend.xml'
          $null = $p.Handle  # cache the handle or ExitCode comes back null
          if (-not $p.WaitForExit(1800000)) {
              Set-Content -Path $marker -Value 'TIMEOUT - sysprep still running after 30 minutes' -Encoding ASCII
              exit 1
          }
          $state = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').ImageState
          if ($p.ExitCode -ne 0) {
              Set-Content -Path $marker -Value "FAILED - sysprep exit code $($p.ExitCode), ImageState=$state" -Encoding ASCII
              exit 1
          }
          if ($state -ne 'IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE') {
              Set-Content -Path $marker -Value "FAILED - unexpected ImageState=$state" -Encoding ASCII
              exit 1
          }
          Set-Content -Path $marker -Value "OK: ImageState=$state" -Encoding ASCII
      } catch {
          Set-Content -Path $marker -Value "ERROR - $($_.Exception.Message)" -Encoding ASCII
          exit 1
      }
      Start-Process -FilePath 'shutdown.exe' -ArgumentList '/s', '/t', '30', '/f'
      & schtasks.exe /Delete /TN OcelotSysprep /F | Out-Null

- name: Launch Sysprep detached via the task scheduler
  ansible.windows.win_shell: |
    if (Test-Path 'C:\Windows\Temp\sysprep-result.txt') {
      Write-Output 'ALREADY LAUNCHED - runner already wrote its marker'
      exit 0
    }
    $tr = 'powershell.exe -ExecutionPolicy Bypass -NonInteractive -NoProfile -File C:\Windows\Temp\run-sysprep.ps1'
    & schtasks.exe /Create /TN OcelotSysprep /TR $tr /SC ONCE /ST 00:00 /RU SYSTEM /RL HIGHEST /F
    if ($LASTEXITCODE -ne 0) { throw "schtasks /Create failed ($LASTEXITCODE)" }
    & schtasks.exe /Run /TN OcelotSysprep
    if ($LASTEXITCODE -ne 0) { throw "schtasks /Run failed ($LASTEXITCODE)" }
    Write-Output 'LAUNCHED'
  register: sysprep_launch
  changed_when: true
  until: sysprep_launch.stdout is defined and sysprep_launch.stdout is search('LAUNCHED')
  retries: 10
  delay: 30

# Short polls: a dropped one costs a retry, not the build. The until
# deliberately breaks out when stdout is missing - that means the box has
# gone away, which is the expected end state, and there is no point polling
# an absent host for another 30 minutes.
- name: Wait for Sysprep to report a verdict
  ansible.windows.win_shell: |
    if (Test-Path 'C:\Windows\Temp\sysprep-result.txt') {
      (Get-Content 'C:\Windows\Temp\sysprep-result.txt' -Raw).Trim()
    } else {
      'PENDING - marker not written yet'
    }
  register: sysprep_poll
  changed_when: false
  until: sysprep_poll.stdout is not defined or sysprep_poll.stdout is search('OK:|FAILED|TIMEOUT|ERROR')
  retries: 120
  delay: 15
  ignore_unreachable: true
  ignore_errors: true

- name: See whether the box comes back (a successful Sysprep powers it off)
  ansible.builtin.wait_for_connection:
    timeout: 420
    sleep: 20
  register: sysprep_reconnect
  ignore_unreachable: true
  ignore_errors: true
  when: sysprep_poll.stdout is not defined or sysprep_poll.stdout is not search('OK:')

- name: Read the Sysprep verdict again now that the box is back
  ansible.windows.win_shell: |
    $m = if (Test-Path 'C:\Windows\Temp\sysprep-result.txt') { (Get-Content 'C:\Windows\Temp\sysprep-result.txt' -Raw).Trim() } else { 'no marker' }
    $s = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').ImageState
    Write-Output "$m | ImageState=$s"
  register: sysprep_final
  changed_when: false
  until: sysprep_final.stdout is not defined or sysprep_final.stdout is search('OK:|FAILED|TIMEOUT|ERROR|IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE')
  retries: 120
  delay: 15
  ignore_unreachable: true
  ignore_errors: true
  when:
    - sysprep_reconnect.skipped is not defined
    - sysprep_reconnect is not failed
    - sysprep_reconnect is reachable

- name: Work out the Sysprep verdict
  ansible.builtin.set_fact:
    sysprep_verdict: "{{ (sysprep_poll.stdout | default('')) ~ ' ' ~ (sysprep_final.stdout | default('')) }}"

- name: Sysprep outcome
  ansible.builtin.debug:
    msg: "{{ sysprep_verdict | trim | default('box powered itself off - the runner reached its shutdown line', true) }}"

- name: Fail if the Sysprep runner reported a problem
  ansible.builtin.fail:
    msg: "Sysprep runner reported: {{ sysprep_verdict | trim }} - see C:\\Windows\\System32\\Sysprep\\Panther\\setuperr.log on the build VM"
  when: sysprep_verdict is search('FAILED|TIMEOUT|ERROR')

- name: Fail if the box is still up but Sysprep never generalized it
  ansible.builtin.fail:
    msg: "Sysprep did not complete - state after reconnect: {{ sysprep_verdict | trim | default('unreadable', true) }}"
  when:
    - sysprep_verdict is not search('OK:|IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE')
    - sysprep_final.stdout is defined
