---
- name: Build Image
  hosts: all
  gather_facts: no
  become: no
  vars:
    # Positive proof that cloudbase-init has already RUN on THIS boot - not
    # merely that its service happens to sit at 'Stopped' right now. Straight
    # after a reboot the service usually has not started yet, so the old
    # "Status -ne Stopped -> done" check returned DONE on the very first try
    # and the play walked straight into the network reconfiguration it was
    # supposed to wait out. Requiring a log write newer than LastBootUpTime
    # tells "not started yet" apart from "ran and exited".
    cbi_probe: |
      $svcs = @(Get-Service -Name 'cloudbase-init*' -ErrorAction SilentlyContinue)
      if ($svcs.Count -eq 0) { Write-Output 'DONE - no cloudbase-init service on this image'; exit 0 }
      $busy = @($svcs | Where-Object { $_.Status -ne 'Stopped' })
      if ($busy.Count -gt 0) {
        $names = ($busy | ForEach-Object { $_.Name + '=' + $_.Status }) -join ' '
        Write-Output "RUNNING - $names"
        exit 0
      }
      $boot = (Get-CimInstance -ClassName Win32_OperatingSystem).LastBootUpTime
      $logs = @(Get-ChildItem -ErrorAction SilentlyContinue -Path @(
        'C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\*.log',
        'C:\Program Files (x86)\Cloudbase Solutions\Cloudbase-Init\log\*.log'))
      if ($logs.Count -eq 0) {
        $up = ((Get-Date) - $boot).TotalSeconds
        if ($up -lt 300) { Write-Output ('RUNNING - no log to check, only ' + [int]$up + 's since boot'); exit 0 }
        Write-Output 'DONE - no cloudbase-init log, settle window elapsed'
        exit 0
      }
      $newest = ($logs | Sort-Object LastWriteTime -Descending)[0]
      if ($newest.LastWriteTime -lt $boot) {
        Write-Output ('RUNNING - stopped, but has not logged since boot (' + $newest.LastWriteTime + ' < ' + $boot + ')')
        exit 0
      }
      Write-Output ('DONE - cloudbase-init ran and exited (last log ' + $newest.LastWriteTime + ')')

  tasks:

    # Safety net for first-boot flakiness (e.g. the base image's one-time NIC
    # reinstall). Do NOT guard later tasks with until/retries instead: Ansible's
    # generic task-retry wrapper does not retry connection-level exceptions, so
    # a mid-playbook [Errno 111] kills the run without a single retry attempt.
    # wait_for_connection is the only primitive here that polls through them.
    - name: Wait for WinRM to come up after first boot
      ansible.builtin.wait_for_connection:
        timeout: 900
        sleep: 10

    # cloudbase-init re-runs on EVERY boot and reconfigures the network a few
    # minutes in - observed live on a build VM it renames the adapter
    # ("Ethernet 2" -> "tap1323108a-a0") and re-applies MTU 1442. Any task
    # holding a WinRM connection open across that moment dies with
    # ConnectionResetError(104); that is what kept killing the long MSI steps,
    # roughly 1-2 minutes in, while the install itself carried on fine on the
    # box. Let cloudbase-init finish instead of racing it - don't just disable
    # it, the MTU it sets is needed for this overlay network.
    # Two traps here, both of which bit us. First, the probe must not believe
    # a service that has not started yet (see cbi_probe). Second, the wait
    # itself gets cut off by the very disruption it is waiting out; it is
    # ignored so the play survives, but then nothing re-checked and we
    # continued while cloudbase-init was still working - that is what left
    # the box unreachable later on. Ansible's until/retries cannot ride
    # through an unreachable result (the until expression references
    # cbi.stdout, which an unreachable result does not have, and that aborts
    # the retry loop), so the recovery has to be explicit: reconnect, probe
    # again, and only the last pass is authoritative.
    - name: Wait for cloudbase-init to finish (first boot, pass 1)
      ansible.windows.win_shell: "{{ cbi_probe }}"
      register: cbi
      changed_when: false
      until: cbi.stdout is search('DONE')
      retries: 60
      delay: 10
      ignore_unreachable: true
      ignore_errors: true

    - name: Reconnect after the cloudbase-init window (first boot, pass 1)
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15

    - name: Wait for cloudbase-init to finish (first boot, pass 2)
      ansible.windows.win_shell: "{{ cbi_probe }}"
      register: cbi
      changed_when: false
      until: cbi.stdout is search('DONE')
      retries: 60
      delay: 10
      ignore_unreachable: true
      ignore_errors: true

    - name: Reconnect after the cloudbase-init window (first boot, pass 2)
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15

    - name: Confirm cloudbase-init is really done (first boot)
      ansible.windows.win_shell: "{{ cbi_probe }}"
      register: cbi
      changed_when: false
      until: cbi.stdout is defined and cbi.stdout is search('DONE')
      retries: 60
      delay: 10

    - name: Ensure OpenSSH Server capability is present
      ansible.windows.win_powershell:
        script: |
          if (!(Get-Service sshd -ErrorAction SilentlyContinue)) {
              Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
      register: res
      until: res is succeeded
      retries: 3
      delay: 15

    - name: output
      debug:
        msg: "{{ res.output }}"

    - name: set administrative pubkey for user caveadmin
      ansible.windows.win_powershell:
        script: |
          add-content -path "$env:ProgramData\ssh\administrators_authorized_keys" -value "ssh-rsa "
          &'icacls' $env:ProgramData\ssh\administrators_authorized_keys /inheritance:r /grant "*S-1-5-32-544:F" /grant "SYSTEM:F"
      register: res

    - name: output
      debug:
        msg: "{{ res.output }}"

    - name: Start OpenSSH
      ansible.windows.win_service:
        name: sshd
        state: started
        start_mode: auto

    - name: Set firewall rules to allow SSH and set powershell as default shell
      ansible.windows.win_powershell:
        script: |
          $firewallParams = @{
          Name        = 'sshd-Server-In-TCP'
          DisplayName = 'Inbound rule for OpenSSH Server (sshd) on TCP port 22'
          Action      = 'Allow'
          Direction   = 'Inbound'
          Enabled     = 'True'  # This is not a boolean but an enum
          Profile     = 'Any'
          Protocol    = 'TCP'
          LocalPort   = 22
          }
          New-NetFirewallRule @firewallParams

          $shellParams = @{
              Path         = 'HKLM:\SOFTWARE\OpenSSH'
              Name         = 'DefaultShell'
              Value        = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
              PropertyType = 'String'
              Force        = $true
          }
          New-ItemProperty @shellParams

    - name: Allow Pings
      block:
      - name: Allow inbound ICMPv4 echo requests (ping)
        community.windows.win_firewall_rule:
          name: "Allow-Ping-ICMPv4"
          enable: yes
          direction: in
          action: allow
          protocol: ICMPv4

    - name: Disable Defender
      block:

      - name: Disable Microsoft Defender permanently via Registry
        ansible.windows.win_regedit:
          path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender
          name: DisableAntiSpyware
          data: 1
          type: dword

      - name: Disable real-time protection permanently via Registry
        ansible.windows.win_regedit:
          path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection
          name: DisableRealtimeMonitoring
          data: 1
          type: dword

    - name: Reboot Windows host
      ansible.windows.win_reboot:
        msg: "Rebooting to apply changes"
        reboot_timeout: 900
        post_reboot_delay: 60

    # Same race again on this boot - and this is the one that actually bit,
    # since the long downloads/installs all sit after this reboot.
    # Two traps here, both of which bit us. First, the probe must not believe
    # a service that has not started yet (see cbi_probe). Second, the wait
    # itself gets cut off by the very disruption it is waiting out; it is
    # ignored so the play survives, but then nothing re-checked and we
    # continued while cloudbase-init was still working - that is what left
    # the box unreachable later on. Ansible's until/retries cannot ride
    # through an unreachable result (the until expression references
    # cbi.stdout, which an unreachable result does not have, and that aborts
    # the retry loop), so the recovery has to be explicit: reconnect, probe
    # again, and only the last pass is authoritative.
    - name: Wait for cloudbase-init to finish (reboot, pass 1)
      ansible.windows.win_shell: "{{ cbi_probe }}"
      register: cbi
      changed_when: false
      until: cbi.stdout is search('DONE')
      retries: 60
      delay: 10
      ignore_unreachable: true
      ignore_errors: true

    - name: Reconnect after the cloudbase-init window (reboot, pass 1)
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15

    - name: Wait for cloudbase-init to finish (reboot, pass 2)
      ansible.windows.win_shell: "{{ cbi_probe }}"
      register: cbi
      changed_when: false
      until: cbi.stdout is search('DONE')
      retries: 60
      delay: 10
      ignore_unreachable: true
      ignore_errors: true

    - name: Reconnect after the cloudbase-init window (reboot, pass 2)
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15

    - name: Confirm cloudbase-init is really done (reboot)
      ansible.windows.win_shell: "{{ cbi_probe }}"
      register: cbi
      changed_when: false
      until: cbi.stdout is defined and cbi.stdout is search('DONE')
      retries: 60
      delay: 10

    - name: RDP enabled
      block:
      - name: Set Registry Key to allow RDP
        ansible.windows.win_regedit:
          path: HKLM:\System\CurrentControlSet\Control\Terminal Server
          name: fDenyTSConnections
          data: 0
          type: dword

      - name: Firewall allow RDP
        community.windows.win_firewall_rule:
          name: "Allow RDP"
          localport: 3389
          action: allow
          direction: in
          protocol: TCP
          enabled: yes

      - name: Start Remote Desktop Service
        ansible.windows.win_service:
          name: TermService
          state: started
          start_mode: auto

      - name: Get all members of local Administrators group
        ansible.windows.win_powershell:
          script: |
            Get-LocalGroupMember -Group "Administrators" | ForEach-Object { $_.Name.Split('\')[-1] }
        register: admins

      - name: Print admin group members
        ansible.builtin.debug:
          msg: "Administrators: {{ admins.output }}"

      - name: Set RDP group to exactly match admins
        ansible.windows.win_group_membership:
          name: "Remote Desktop Users"
          members: "{{ admins.output }}"
          state: pure

    - name: Install RSAT for Active Directory
      block:
        - name: Install RSAT Active Directory (Windows 11 capability)
          ansible.windows.win_powershell:
            script: |
              if (!(Get-Command Get-ADUser -ErrorAction SilentlyContinue)) {
                  Add-WindowsCapability -Online -Name Rsat.ActiveDirectory.DS-LDS.Tools~~~~0.0.1.0
              }

    - name: Ordinary user-facing software
      block:
      # Pinned to a fast mirror on purpose. The upstream
      # downloadarchive.documentfoundation.org host that serves /old/
      # releases is throttled hard: measured from a build VM it delivered
      # 0.22 MB/s, so this 349 MB file needed ~26 minutes and no WinRM
      # connection survives being held open for a single operation that
      # long. Every "connection reset" failure on this task traced back to
      # that, not to the download logic. The same file off ftp.fau.de runs
      # at ~125 MB/s (~3s). 25.8.7 rather than 25.8.2.2 because the fast
      # mirrors only carry current stable, never the /old/ archive.
      - name: Download LibreOffice MSI
        ansible.windows.win_get_url:
          url: "https://ftp.fau.de/tdf/libreoffice/stable/25.8.7/win/x86_64/LibreOffice_25.8.7_Win_x86-64.msi"
          dest: "C:\\Windows\\Temp\\LibreOffice.msi"
          timeout: 600
        register: libreoffice_dl
        until: libreoffice_dl is succeeded
        retries: 3
        delay: 10

      # The MSI install still holds one WinRM operation open for several
      # minutes, which is long enough to get reset - so this half keeps its
      # recovery path. rescue: can't be used: a reset can surface as
      # "unreachable", which rescue never catches, so ignore_unreachable
      # keeps the play alive and the retry is driven by when:.
      - name: Install LibreOffice
        ansible.windows.win_package:
          path: "C:\\Windows\\Temp\\LibreOffice.msi"
          arguments: "/quiet /norestart /log C:\\Windows\\Temp\\lo-install.log"
          state: present
        ignore_unreachable: true
        ignore_errors: true
        register: libreoffice_install

      - name: WinRM dropped mid-MSI - wait for it to come back
        ansible.builtin.wait_for_connection:
          timeout: 600
          sleep: 10
        when: libreoffice_install is unreachable or libreoffice_install is failed

      - name: Finish / verify LibreOffice install
        ansible.windows.win_package:
          path: "C:\\Windows\\Temp\\LibreOffice.msi"
          arguments: "/quiet /norestart /log C:\\Windows\\Temp\\lo-install.log"
          state: present
        register: libreoffice_install
        ignore_unreachable: true
        until: libreoffice_install is succeeded
        retries: 10
        delay: 30
        when: libreoffice_install is unreachable or libreoffice_install is failed

      - name: Download 7-Zip
        ansible.windows.win_get_url:
          url: "https://www.7-zip.org/a/7z2408-x64.exe"
          dest: "C:\\Windows\\Temp\\7zip.exe"
        register: sevenzip_dl
        retries: 5
        delay: 10
        until: sevenzip_dl is succeeded

      - name: Install 7-Zip
        ansible.windows.win_package:
          path: "C:\\Windows\\Temp\\7zip.exe"
          arguments: "/S"
          state: present

    - name: Lived-in default profile (copied into every new user profile on first logon)
      block:
      - name: Create default-profile folders
        ansible.windows.win_file:
          path: "C:\\Users\\Default\\{{ item }}"
          state: directory
        loop:
          - Desktop
          - Documents
          - Downloads

      - name: Place generic desktop clutter
        ansible.windows.win_copy:
          dest: "C:\\Users\\Default\\Desktop\\IT-Contact.txt"
          content: |
            For issues with your computer, login, or printer, please open a ticket in the helpdesk portal.
            For urgent matters: internal extension 4200.

      - name: Place generic document clutter
        ansible.windows.win_copy:
          dest: "C:\\Users\\Default\\Documents\\{{ item.name }}"
          content: "{{ item.content }}"
        loop:
          - name: "Team_Meeting_Minutes.txt"
            content: |
              Team Meeting Minutes

              Attendees: Team
              Agenda:
              - Status update on ongoing projects
              - Planning for next quarter
              - Miscellaneous

              Next meeting: see calendar invite.
          - name: "Vacation_Request_Template.txt"
            content: |
              Vacation Request

              Name:
              Period from/to:
              Covered by:

              Please send the completed form to HR.

      - name: Place generic downloads clutter
        ansible.windows.win_copy:
          dest: "C:\\Users\\Default\\Downloads\\Expense_Report_Template.txt"
          content: |
            Expense Report

            Date:
            Purpose:
            Costs (travel/lodging/meals):
            Receipts attached: yes/no

    - name: Enable NTLM
      block:
        - name: Ensure NTLM is enabled by default
          ansible.windows.win_regedit:
            path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
            name: LmCompatibilityLevel
            data: 5
            type: dword
            state: present

    - name: Print Spooler running
      block:
        - name: Ensure Print Spooler starts automatically
          ansible.windows.win_service:
            name: Spooler
            start_mode: auto
            state: started

    - name: Execution policy
      block:
        - name: Set system-wide PowerShell execution policy to Unrestricted
          ansible.windows.win_shell: |
            Set-ExecutionPolicy Unrestricted -Scope LocalMachine -Force

    - name: User Account Control
      block:
      - name: Disable UAC permanently for administrators
        ansible.windows.win_regedit:
          path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          name: EnableLUA
          value: 0
          type: dword

    - name: Net profile set to Private
      block:
      - name: Set all network interfaces to Private
        ansible.windows.win_shell: |
          $profiles = Get-NetConnectionProfile
          foreach ($p in $profiles) {
              if ($p.NetworkCategory -ne 'Private') {
                  Set-NetConnectionProfile -InterfaceIndex $p.InterfaceIndex -NetworkCategory Private
              }
          }
        args:
          executable: powershell.exe

    - name: Wait 30 seconds at the end of the playbook
      ansible.builtin.pause:
        seconds: 30

    # win11-patient-zero and win11-engineering-workstation import this play
    # and then run their own play on top of it. Generalizing here would leave
    # them modifying an already-sysprepped image and generalizing a second
    # time, which corrupts image state - /generalize is not repeatable. They
    # pass run_sysprep_in_base=false and carry their own copy of this block at
    # the end of their own play instead.
    - name: Generalize this image with Sysprep
      when: run_sysprep_in_base | default(true) | bool
      block:

        # Sysprep validates that no update/servicing operation is pending
        # ("reserved storage in use") and, just like the BitLocker case, doesn't
        # exit cleanly on that failure - it just hangs forever instead. Installing
        # Windows Capabilities (OpenSSH, RSAT) above leaves a pending reboot/CBS
        # state that trips this validation. Confirmed live: RebootPending and
        # RebootRequired were both true, and Sysprep's own log showed exactly
        # this failure (hr = 0x800F0975) the moment it started, with the process
        # then sitting idle for hours instead of returning an error. One more
        # reboot right before Sysprep clears that state.
        - name: Reboot to clear any pending servicing operations before Sysprep
          ansible.windows.win_reboot:
            msg: "Rebooting to clear pending updates before Sysprep"
            reboot_timeout: 900
            post_reboot_delay: 60

        # Two traps here, both of which bit us. First, the probe must not believe
        # a service that has not started yet (see cbi_probe). Second, the wait
        # itself gets cut off by the very disruption it is waiting out; it is
        # ignored so the play survives, but then nothing re-checked and we
        # continued while cloudbase-init was still working - that is what left
        # the box unreachable later on. Ansible's until/retries cannot ride
        # through an unreachable result (the until expression references
        # cbi.stdout, which an unreachable result does not have, and that aborts
        # the retry loop), so the recovery has to be explicit: reconnect, probe
        # again, and only the last pass is authoritative.
        - name: Wait for cloudbase-init to finish (pre-Sysprep reboot, pass 1)
          ansible.windows.win_shell: "{{ cbi_probe }}"
          register: cbi
          changed_when: false
          until: cbi.stdout is search('DONE')
          retries: 60
          delay: 10
          ignore_unreachable: true
          ignore_errors: true

        - name: Reconnect after the cloudbase-init window (pre-Sysprep reboot, pass 1)
          ansible.builtin.wait_for_connection:
            timeout: 1800
            sleep: 15

        - name: Wait for cloudbase-init to finish (pre-Sysprep reboot, pass 2)
          ansible.windows.win_shell: "{{ cbi_probe }}"
          register: cbi
          changed_when: false
          until: cbi.stdout is search('DONE')
          retries: 60
          delay: 10
          ignore_unreachable: true
          ignore_errors: true

        - name: Reconnect after the cloudbase-init window (pre-Sysprep reboot, pass 2)
          ansible.builtin.wait_for_connection:
            timeout: 1800
            sleep: 15

        - name: Confirm cloudbase-init is really done (pre-Sysprep reboot)
          ansible.windows.win_shell: "{{ cbi_probe }}"
          register: cbi
          changed_when: false
          until: cbi.stdout is defined and cbi.stdout is search('DONE')
          retries: 60
          delay: 10

        - name: Ensure the Panther\Unattend directory exists
          ansible.windows.win_file:
            path: "C:\\Windows\\Panther\\Unattend"
            state: directory

        - name: Upload unattend.xml for Sysprep
          ansible.windows.win_copy:
            src: "unattend.xml"
            dest: "C:\\Windows\\Panther\\Unattend\\unattend.xml"

        # Sysprep hard-fails generalize if the OS volume is encrypted (base image
        # picks up an orphaned BitLocker/Device Encryption state - no key
        # protector, protection off, but VolumeStatus stays FullyEncrypted until
        # explicitly decrypted). Bounded wait so a real problem fails loud.
        - name: Decrypt the OS volume if BitLocker/Device Encryption is on
          ansible.windows.win_powershell:
            script: |
              $vol = Get-BitLockerVolume -MountPoint C:
              if ($vol.VolumeStatus -ne 'FullyDecrypted') {
                Disable-BitLocker -MountPoint C: | Out-Null
                $t = 3600
                while ($t -gt 0 -and $vol.VolumeStatus -ne 'FullyDecrypted') {
                  Start-Sleep -Seconds 10
                  $t -= 10
                  $vol = Get-BitLockerVolume -MountPoint C:
                  Write-Output ('BitLocker ' + $vol.VolumeStatus + ' ' + $vol.EncryptionPercentage + '%')
                }
                if ($vol.VolumeStatus -ne 'FullyDecrypted') {
                  Write-Error 'BitLocker did not finish decrypting before timeout'
                  exit 1
                }
              }
          register: bitlocker_check
          ignore_unreachable: true
          ignore_errors: true

        - name: WinRM dropped during the BitLocker check - wait for it to come back
          ansible.builtin.wait_for_connection:
            timeout: 900
            sleep: 15
          when: bitlocker_check is unreachable or bitlocker_check is failed

        - name: Retry the BitLocker check (idempotent - no-ops if already decrypted)
          ansible.windows.win_powershell:
            script: |
              $vol = Get-BitLockerVolume -MountPoint C:
              if ($vol.VolumeStatus -ne 'FullyDecrypted') {
                Disable-BitLocker -MountPoint C: | Out-Null
                $t = 3600
                while ($t -gt 0 -and $vol.VolumeStatus -ne 'FullyDecrypted') {
                  Start-Sleep -Seconds 10
                  $t -= 10
                  $vol = Get-BitLockerVolume -MountPoint C:
                  Write-Output ('BitLocker ' + $vol.VolumeStatus + ' ' + $vol.EncryptionPercentage + '%')
                }
                if ($vol.VolumeStatus -ne 'FullyDecrypted') {
                  Write-Error 'BitLocker did not finish decrypting before timeout'
                  exit 1
                }
              }
          when: bitlocker_check is unreachable or bitlocker_check is failed

        # Sysprep is the one step that cannot be run inside a single held-open
        # WinRM call: /generalize tears the WinRM listener down as part of the
        # generalize pass, and the run takes minutes. The previous build died on
        # a plain TCP connect timeout before Sysprep had even been launched, and
        # the box then stayed unreachable for 640s - longer than the 600s
        # reconnect window.
        #
        # So launch it detached as a SYSTEM scheduled task. Unlike Ansible's
        # async watchdog (proven not to survive on these VMs), the Task Scheduler
        # owns the process, so it does not care what happens to WinRM. The runner
        # writes its verdict to a marker file and powers the box off ONLY on
        # success, which makes the outcome decidable without WinRM having to
        # survive generalize:
        #   marker says OK / ImageState generalized  -> success
        #   marker says FAILED / TIMEOUT / ERROR     -> fail loud, with the reason
        #   box gone and never comes back            -> the runner reached its
        #                                               shutdown line, so success
        #   box back up but not generalized          -> fail loud
        # Packer's openstack builder stops the instance via the API afterwards and
        # tolerates it already being off, so powering down here is safe.
        # Sysprep is never re-run on a connection drop: /generalize is not
        # safely repeatable.
        - name: Make sure the box is reachable before starting Sysprep
          ansible.builtin.wait_for_connection:
            timeout: 1800
            sleep: 15

        - name: Drop any stale Sysprep result marker
          ansible.windows.win_file:
            path: C:\Windows\Temp\sysprep-result.txt
            state: absent

        - name: Stage the detached Sysprep runner
          ansible.windows.win_copy:
            dest: C:\Windows\Temp\run-sysprep.ps1
            content: |
              $ErrorActionPreference = 'Stop'
              $marker = 'C:\Windows\Temp\sysprep-result.txt'
              try {
                  Set-Content -Path $marker -Value 'RUNNING' -Encoding ASCII
                  $p = Start-Process -FilePath 'C:\Windows\System32\Sysprep\Sysprep.exe' -PassThru -ArgumentList '/oobe', '/generalize', '/quiet', '/quit', '/unattend:C:\Windows\Panther\Unattend\unattend.xml'
                  $null = $p.Handle  # cache the handle or ExitCode comes back null
                  if (-not $p.WaitForExit(1800000)) {
                      Set-Content -Path $marker -Value 'TIMEOUT - sysprep still running after 30 minutes' -Encoding ASCII
                      exit 1
                  }
                  $state = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').ImageState
                  if ($p.ExitCode -ne 0) {
                      Set-Content -Path $marker -Value "FAILED - sysprep exit code $($p.ExitCode), ImageState=$state" -Encoding ASCII
                      exit 1
                  }
                  if ($state -ne 'IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE') {
                      Set-Content -Path $marker -Value "FAILED - unexpected ImageState=$state" -Encoding ASCII
                      exit 1
                  }
                  Set-Content -Path $marker -Value "OK: ImageState=$state" -Encoding ASCII
              } catch {
                  Set-Content -Path $marker -Value "ERROR - $($_.Exception.Message)" -Encoding ASCII
                  exit 1
              }
              Start-Process -FilePath 'shutdown.exe' -ArgumentList '/s', '/t', '30', '/f'
              & schtasks.exe /Delete /TN OcelotSysprep /F | Out-Null

        - name: Launch Sysprep detached via the task scheduler
          ansible.windows.win_shell: |
            if (Test-Path 'C:\Windows\Temp\sysprep-result.txt') {
              Write-Output 'ALREADY LAUNCHED - runner already wrote its marker'
              exit 0
            }
            $tr = 'powershell.exe -ExecutionPolicy Bypass -NonInteractive -NoProfile -File C:\Windows\Temp\run-sysprep.ps1'
            & schtasks.exe /Create /TN OcelotSysprep /TR $tr /SC ONCE /ST 00:00 /RU SYSTEM /RL HIGHEST /F
            if ($LASTEXITCODE -ne 0) { throw "schtasks /Create failed ($LASTEXITCODE)" }
            & schtasks.exe /Run /TN OcelotSysprep
            if ($LASTEXITCODE -ne 0) { throw "schtasks /Run failed ($LASTEXITCODE)" }
            Write-Output 'LAUNCHED'
          register: sysprep_launch
          changed_when: true
          until: sysprep_launch.stdout is defined and sysprep_launch.stdout is search('LAUNCHED')
          retries: 10
          delay: 30

        # Short polls: a dropped one costs a retry, not the build. The until
        # deliberately breaks out when stdout is missing - that means the box has
        # gone away, which is the expected end state, and there is no point
        # polling an absent host for another 30 minutes.
        - name: Wait for Sysprep to report a verdict
          ansible.windows.win_shell: |
            if (Test-Path 'C:\Windows\Temp\sysprep-result.txt') {
              (Get-Content 'C:\Windows\Temp\sysprep-result.txt' -Raw).Trim()
            } else {
              'PENDING - marker not written yet'
            }
          register: sysprep_poll
          changed_when: false
          until: sysprep_poll.stdout is not defined or sysprep_poll.stdout is search('OK:|FAILED|TIMEOUT|ERROR')
          retries: 120
          delay: 15
          ignore_unreachable: true
          ignore_errors: true

        - name: See whether the box comes back (a successful Sysprep powers it off)
          ansible.builtin.wait_for_connection:
            timeout: 420
            sleep: 20
          register: sysprep_reconnect
          ignore_unreachable: true
          ignore_errors: true
          when: sysprep_poll.stdout is not defined or sysprep_poll.stdout is not search('OK:')

        - name: Read the Sysprep verdict again now that the box is back
          ansible.windows.win_shell: |
            $m = if (Test-Path 'C:\Windows\Temp\sysprep-result.txt') { (Get-Content 'C:\Windows\Temp\sysprep-result.txt' -Raw).Trim() } else { 'no marker' }
            $s = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').ImageState
            Write-Output "$m | ImageState=$s"
          register: sysprep_final
          changed_when: false
          until: sysprep_final.stdout is not defined or sysprep_final.stdout is search('OK:|FAILED|TIMEOUT|ERROR|IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE')
          retries: 120
          delay: 15
          ignore_unreachable: true
          ignore_errors: true
          when:
            - sysprep_reconnect.skipped is not defined
            - sysprep_reconnect is not failed
            - sysprep_reconnect is reachable

        - name: Work out the Sysprep verdict
          ansible.builtin.set_fact:
            sysprep_verdict: "{{ (sysprep_poll.stdout | default('')) ~ ' ' ~ (sysprep_final.stdout | default('')) }}"

        - name: Sysprep outcome
          ansible.builtin.debug:
            msg: "{{ sysprep_verdict | trim | default('box powered itself off - the runner reached its shutdown line', true) }}"

        - name: Fail if the Sysprep runner reported a problem
          ansible.builtin.fail:
            msg: "Sysprep runner reported: {{ sysprep_verdict | trim }} - see C:\\Windows\\System32\\Sysprep\\Panther\\setuperr.log on the build VM"
          when: sysprep_verdict is search('FAILED|TIMEOUT|ERROR')

        - name: Fail if the box is still up but Sysprep never generalized it
          ansible.builtin.fail:
            msg: "Sysprep did not complete - state after reconnect: {{ sysprep_verdict | trim | default('unreadable', true) }}"
          when:
            - sysprep_verdict is not search('OK:|IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE')
            - sysprep_final.stdout is defined
