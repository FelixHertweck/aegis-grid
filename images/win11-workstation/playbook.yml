---
- name: Build Image
  hosts: all
  gather_facts: no
  become: no
  tasks:

    # Safety net for first-boot flakiness (e.g. the base image's one-time NIC
    # reinstall). Do NOT guard later tasks with until/retries instead: Ansible's
    # generic task-retry wrapper does not retry connection-level exceptions, so
    # a mid-playbook [Errno 111] kills the run without a single retry attempt.
    # wait_for_connection is the only primitive here that polls through them.
    - name: Wait for WinRM to come up after first boot
      ansible.builtin.wait_for_connection:
        timeout: 900
        sleep: 10

    # cloudbase-init re-runs on EVERY boot and reconfigures the network a few
    # minutes in - observed live on a build VM it renames the adapter
    # ("Ethernet 2" -> "tap1323108a-a0") and re-applies MTU 1442. Any task
    # holding a WinRM connection open across that moment dies with
    # ConnectionResetError(104); that is what kept killing the long MSI steps,
    # roughly 1-2 minutes in, while the install itself carried on fine on the
    # box. Let cloudbase-init finish instead of racing it - don't just disable
    # it, the MTU it sets is needed for this overlay network.
    - name: Wait for cloudbase-init to finish its post-boot run
      ansible.windows.win_shell: |
        $s = Get-Service cloudbase-init -ErrorAction SilentlyContinue
        if ($s -and $s.Status -ne 'Stopped') { 'RUNNING' } else { 'DONE' }
      register: cbi
      changed_when: false
      until: cbi.stdout is search('DONE')
      retries: 60
      delay: 10
      ignore_unreachable: true
      ignore_errors: true

    - name: Reconnect in case cloudbase-init bounced the network while we waited
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 10

    - name: Ensure OpenSSH Server capability is present
      ansible.windows.win_powershell:
        script: |
          if (!(Get-Service sshd -ErrorAction SilentlyContinue)) {
              Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
      register: res
      until: res is succeeded
      retries: 3
      delay: 15

    - name: output
      debug:
        msg: "{{ res.output }}"

    - name: set administrative pubkey for user caveadmin
      ansible.windows.win_powershell:
        script: |
          add-content -path "$env:ProgramData\ssh\administrators_authorized_keys" -value "ssh-rsa "
          &'icacls' $env:ProgramData\ssh\administrators_authorized_keys /inheritance:r /grant "*S-1-5-32-544:F" /grant "SYSTEM:F"
      register: res

    - name: output
      debug:
        msg: "{{ res.output }}"

    - name: Start OpenSSH
      ansible.windows.win_service:
        name: sshd
        state: started
        start_mode: auto

    - name: Set firewall rules to allow SSH and set powershell as default shell
      ansible.windows.win_powershell:
        script: |
          $firewallParams = @{
          Name        = 'sshd-Server-In-TCP'
          DisplayName = 'Inbound rule for OpenSSH Server (sshd) on TCP port 22'
          Action      = 'Allow'
          Direction   = 'Inbound'
          Enabled     = 'True'  # This is not a boolean but an enum
          Profile     = 'Any'
          Protocol    = 'TCP'
          LocalPort   = 22
          }
          New-NetFirewallRule @firewallParams

          $shellParams = @{
              Path         = 'HKLM:\SOFTWARE\OpenSSH'
              Name         = 'DefaultShell'
              Value        = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
              PropertyType = 'String'
              Force        = $true
          }
          New-ItemProperty @shellParams

    - name: Allow Pings
      block:
      - name: Allow inbound ICMPv4 echo requests (ping)
        community.windows.win_firewall_rule:
          name: "Allow-Ping-ICMPv4"
          enable: yes
          direction: in
          action: allow
          protocol: ICMPv4

    - name: Disable Defender
      block:

      - name: Disable Microsoft Defender permanently via Registry
        ansible.windows.win_regedit:
          path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender
          name: DisableAntiSpyware
          data: 1
          type: dword

      - name: Disable real-time protection permanently via Registry
        ansible.windows.win_regedit:
          path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection
          name: DisableRealtimeMonitoring
          data: 1
          type: dword

    - name: Reboot Windows host
      ansible.windows.win_reboot:
        msg: "Rebooting to apply changes"
        reboot_timeout: 600

    # Same race again on this boot - and this is the one that actually bit,
    # since the long downloads/installs all sit after this reboot.
    - name: Wait for cloudbase-init to finish after the reboot
      ansible.windows.win_shell: |
        $s = Get-Service cloudbase-init -ErrorAction SilentlyContinue
        if ($s -and $s.Status -ne 'Stopped') { 'RUNNING' } else { 'DONE' }
      register: cbi
      changed_when: false
      until: cbi.stdout is search('DONE')
      retries: 60
      delay: 10
      ignore_unreachable: true
      ignore_errors: true

    - name: Reconnect in case cloudbase-init bounced the network while we waited
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 10

    - name: RDP enabled
      block:
      - name: Set Registry Key to allow RDP
        ansible.windows.win_regedit:
          path: HKLM:\System\CurrentControlSet\Control\Terminal Server
          name: fDenyTSConnections
          data: 0
          type: dword

      - name: Firewall allow RDP
        community.windows.win_firewall_rule:
          name: "Allow RDP"
          localport: 3389
          action: allow
          direction: in
          protocol: TCP
          enabled: yes

      - name: Start Remote Desktop Service
        ansible.windows.win_service:
          name: TermService
          state: started
          start_mode: auto

      - name: Get all members of local Administrators group
        ansible.windows.win_powershell:
          script: |
            Get-LocalGroupMember -Group "Administrators" | ForEach-Object { $_.Name.Split('\')[-1] }
        register: admins

      - name: Print admin group members
        ansible.builtin.debug:
          msg: "Administrators: {{ admins.output }}"

      - name: Set RDP group to exactly match admins
        ansible.windows.win_group_membership:
          name: "Remote Desktop Users"
          members: "{{ admins.output }}"
          state: pure

    - name: Install RSAT for Active Directory
      block:
        - name: Install RSAT Active Directory (Windows 11 capability)
          ansible.windows.win_powershell:
            script: |
              if (!(Get-Command Get-ADUser -ErrorAction SilentlyContinue)) {
                  Add-WindowsCapability -Online -Name Rsat.ActiveDirectory.DS-LDS.Tools~~~~0.0.1.0
              }

    - name: Ordinary user-facing software
      block:
      # Pinned to a fast mirror on purpose. The upstream
      # downloadarchive.documentfoundation.org host that serves /old/
      # releases is throttled hard: measured from a build VM it delivered
      # 0.22 MB/s, so this 349 MB file needed ~26 minutes and no WinRM
      # connection survives being held open for a single operation that
      # long. Every "connection reset" failure on this task traced back to
      # that, not to the download logic. The same file off ftp.fau.de runs
      # at ~125 MB/s (~3s). 25.8.7 rather than 25.8.2.2 because the fast
      # mirrors only carry current stable, never the /old/ archive.
      - name: Download LibreOffice MSI
        ansible.windows.win_get_url:
          url: "https://ftp.fau.de/tdf/libreoffice/stable/25.8.7/win/x86_64/LibreOffice_25.8.7_Win_x86-64.msi"
          dest: "C:\\Windows\\Temp\\LibreOffice.msi"
          timeout: 600
        register: libreoffice_dl
        until: libreoffice_dl is succeeded
        retries: 3
        delay: 10

      # The MSI install still holds one WinRM operation open for several
      # minutes, which is long enough to get reset - so this half keeps its
      # recovery path. rescue: can't be used: a reset can surface as
      # "unreachable", which rescue never catches, so ignore_unreachable
      # keeps the play alive and the retry is driven by when:.
      - name: Install LibreOffice
        ansible.windows.win_package:
          path: "C:\\Windows\\Temp\\LibreOffice.msi"
          arguments: "/quiet /norestart /log C:\\Windows\\Temp\\lo-install.log"
          state: present
        ignore_unreachable: true
        ignore_errors: true
        register: libreoffice_install

      - name: WinRM dropped mid-MSI - wait for it to come back
        ansible.builtin.wait_for_connection:
          timeout: 600
          sleep: 10
        when: libreoffice_install is unreachable or libreoffice_install is failed

      - name: Finish / verify LibreOffice install
        ansible.windows.win_package:
          path: "C:\\Windows\\Temp\\LibreOffice.msi"
          arguments: "/quiet /norestart /log C:\\Windows\\Temp\\lo-install.log"
          state: present
        register: libreoffice_install
        ignore_unreachable: true
        until: libreoffice_install is succeeded
        retries: 10
        delay: 30
        when: libreoffice_install is unreachable or libreoffice_install is failed

      - name: Download 7-Zip
        ansible.windows.win_get_url:
          url: "https://www.7-zip.org/a/7z2408-x64.exe"
          dest: "C:\\Windows\\Temp\\7zip.exe"
        register: sevenzip_dl
        retries: 5
        delay: 10
        until: sevenzip_dl is succeeded

      - name: Install 7-Zip
        ansible.windows.win_package:
          path: "C:\\Windows\\Temp\\7zip.exe"
          arguments: "/S"
          state: present

    - name: Lived-in default profile (copied into every new user profile on first logon)
      block:
      - name: Create default-profile folders
        ansible.windows.win_file:
          path: "C:\\Users\\Default\\{{ item }}"
          state: directory
        loop:
          - Desktop
          - Documents
          - Downloads

      - name: Place generic desktop clutter
        ansible.windows.win_copy:
          dest: "C:\\Users\\Default\\Desktop\\IT-Contact.txt"
          content: |
            For issues with your computer, login, or printer, please open a ticket in the helpdesk portal.
            For urgent matters: internal extension 4200.

      - name: Place generic document clutter
        ansible.windows.win_copy:
          dest: "C:\\Users\\Default\\Documents\\{{ item.name }}"
          content: "{{ item.content }}"
        loop:
          - name: "Team_Meeting_Minutes.txt"
            content: |
              Team Meeting Minutes

              Attendees: Team
              Agenda:
              - Status update on ongoing projects
              - Planning for next quarter
              - Miscellaneous

              Next meeting: see calendar invite.
          - name: "Vacation_Request_Template.txt"
            content: |
              Vacation Request

              Name:
              Period from/to:
              Covered by:

              Please send the completed form to HR.

      - name: Place generic downloads clutter
        ansible.windows.win_copy:
          dest: "C:\\Users\\Default\\Downloads\\Expense_Report_Template.txt"
          content: |
            Expense Report

            Date:
            Purpose:
            Costs (travel/lodging/meals):
            Receipts attached: yes/no

    - name: Enable NTLM
      block:
        - name: Ensure NTLM is enabled by default
          ansible.windows.win_regedit:
            path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
            name: LmCompatibilityLevel
            data: 5
            type: dword
            state: present

    - name: Print Spooler running
      block:
        - name: Ensure Print Spooler starts automatically
          ansible.windows.win_service:
            name: Spooler
            start_mode: auto
            state: started

    - name: Execution policy
      block:
        - name: Set system-wide PowerShell execution policy to Unrestricted
          ansible.windows.win_shell: |
            Set-ExecutionPolicy Unrestricted -Scope LocalMachine -Force

    - name: User Account Control
      block:
      - name: Disable UAC permanently for administrators
        ansible.windows.win_regedit:
          path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          name: EnableLUA
          value: 0
          type: dword

    - name: Net profile set to Private
      block:
      - name: Set all network interfaces to Private
        ansible.windows.win_shell: |
          $profiles = Get-NetConnectionProfile
          foreach ($p in $profiles) {
              if ($p.NetworkCategory -ne 'Private') {
                  Set-NetConnectionProfile -InterfaceIndex $p.InterfaceIndex -NetworkCategory Private
              }
          }
        args:
          executable: powershell.exe

    - name: Wait 30 seconds at the end of the playbook
      ansible.builtin.pause:
        seconds: 30
